<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>演出复盘评估系统</title>
<style>
:root{
  --bg:#faf9f6; --panel:#ffffff; --line:#e7e3d8;
  --text:#26241f; --muted:#7a766c;
  --gold:#b8860b; --gold-soft:#f7efd9;
  --green:#3f7d53; --green-soft:#e9f4ec;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.8;
}
.wrap{max-width:860px;margin:0 auto;padding:0 20px 60px}
header{padding:44px 0 26px}
h1{font-size:24px;font-weight:700}
.sub{color:var(--muted);font-size:13.5px;margin-top:6px}
h2{font-size:18px;font-weight:700;margin:32px 0 14px;display:flex;align-items:center;gap:9px}
h2::before{content:"";width:16px;height:3px;background:var(--gold);border-radius:2px}
h3{font-size:15px;font-weight:700;margin:22px 0 10px;color:#4a463d}
p{margin:8px 0;font-size:14.5px}
strong{color:#4a463d}
blockquote{
  border-left:3px solid var(--gold);background:var(--gold-soft);
  padding:12px 16px;margin:14px 0;border-radius:0 8px 8px 0;font-size:13.5px;color:#5a5448;
}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:12px 0}
th{background:var(--gold-soft);color:#6b5410;text-align:left;padding:9px 12px;font-size:12.5px}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
ul,ol{padding-left:22px;margin:8px 0}
li{margin:5px 0;font-size:14.5px}
hr{border:none;border-top:1px solid var(--line);margin:30px 0}
.loop{
  background:var(--green-soft);border:1px solid #cfe3d5;border-radius:14px;
  padding:16px 18px;font-size:13.5px;color:#2c4a37;margin-top:20px;
}
.loop b{color:var(--green)}
@media (max-width:560px){
  td,th{padding:8px 9px;font-size:12.5px}
  h2{font-size:16px}
}
@media print{
  body{background:#fff}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>演出复盘评估系统</h1>
  <p class="sub">每场演出后当天填一次 · 趁记忆还热 · 帮你记住哪首歌好用、哪首该换、下次怎么改</p>
</header>

<h1>乐队工具箱（复盘评估 + 串词模板 + 演出手册模板）</h1>
<blockquote>
<p>每场演出：前3天填"演出手册模板" → 前1天填"串词模板" → 演出后当天填"复盘评估系统"。
一句话总结：鼓手是时间锚，主唱是情绪锚，乐队跟鼓走。弹错不停，副歌有动作，串词说完就进歌。</p>
</blockquote>
<hr />

<div class="loop">
  <b>回路闭环：</b>复盘评分 → 曲库优化规则（≥20王牌 / 15-19灵活 / ≤14特定场景） → 更新<a href="../songs/曲库.xlsx">曲库状态</a> → 下一场歌单更精准。
  <br><b>归档：</b>填写后拍照存入 <a href="archive/">review/archive/</a>，在<a href="index.html">归档索引</a>加一行。
</div>

</div>
</body>
</html>
